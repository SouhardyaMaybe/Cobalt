name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is checked in, so the build asks for Gradle directly.
      # The version is pinned for the same reason the NDK is: an unpinned build
      # toolchain turns a green build red with no code change, which is
      # indistinguishable from a real regression.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The NDK is required locally too. See build-android.sh.
      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build the renderer
        run: |
          set -euo pipefail
          chmod +x build-android.sh
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          if [ -z "$NDK" ]; then echo "::error::NDK path is empty"; exit 1; fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "::group::$abi"
            ANDROID_NDK_HOME="$NDK" \
            COBALT_ABI="$abi" \
              ./build-android.sh
            echo "::endgroup::"
          done

      # A renderer that silently loses entry points still builds. The counts are
      # the guard, and this job fails rather than warns.
      # Cross-ABI, and the last thing that can catch a renderer that quietly
      # stopped translating. build-android.sh checks only the ABI it just built,
      # because CI invokes it once per ABI; completeness is a whole-build
      # property, so it is asserted here, once.
      - name: Audit the exported ABI
        run: |
          set -euo pipefail
          # Sorted, one name per line: comm(1) needs both inputs sorted to
          # report set difference rather than "no lines in common".
          python3 -c "import json;print('\\n'.join(sorted(json.load(open('research-mcgl/union_symbols.json')))))" \
            > mcgl_union.txt
          fail=0
          found=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="plugin/src/main/jniLibs/$abi/libcobalt.so"
            if [ ! -f "$so" ]; then
              echo "::error::$abi was never built; the APK would ship without it"
              fail=1
              continue
            fi
            found=$((found + 1))
            gl=$(nm -D --defined-only "$so" | grep -cE ' T gl[A-Z]' || true)
            egl=$(nm -D --defined-only "$so" | grep -cE ' T egl' || true)
            echo "== $abi: gl*=$gl egl*=$egl $(du -h "$so" | cut -f1) =="
            # The renderer exports far more than this. These are floors, not
            # targets: they catch a build that stopped translating rather than
            # one that lost a handful of entry points.
            if [ "$gl" -lt 2000 ]; then
              echo "::error::$abi exported only $gl gl* symbols"
              fail=1
            fi
            if [ "$egl" -lt 20 ]; then
              echo "::error::$abi exported only $egl egl* symbols"
              fail=1
            fi
            # The exported symbol list, kept so it can be diffed against
            # research-mcgl/union_symbols.json -- the union of every GL symbol
            # Minecraft 1.13.2 through 26.3 resolves. Comparing the two
            # locally is far better than adding one probe at a time here.
            nm -D --defined-only "$so" | awk '$2=="T"{print $3}' | sort > "$RUNNER_TEMP/syms-$abi.txt"
            echo "  exported: $(wc -l < "$RUNNER_TEMP/syms-$abi.txt")"
            cp "$RUNNER_TEMP/syms-$abi.txt" "exported-$abi.txt"
            # 26.3 compares the address of glGetError across lookup paths
            # (dlsym vs eglGetProcAddress vs SDL_GL_GetProcAddress), so it has
            # to resolve to exactly one pointer.
            n=$(nm -D --defined-only "$so" | grep -c ' T glGetError$' || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::$abi exports glGetError $n times; 26.3 needs one address"
              fail=1
            fi
            # A renamed renderer must not still answer to the old name in the
            # strings a game reads.
            if nm -D --defined-only "$so" | grep -qi 'mobileglues'; then
              echo "::error::$abi still exports a MobileGlues symbol"
              fail=1
            fi
            # The full set of names Minecraft resolves, as a hard gate. Not a
            # count: a count cannot tell a rename from a removal, which is
            # exactly the mistake that produced the 28 missing ARB/EXT entries
            # in the first place.
            #
            # src/arb_ext.cpp exists to close this gap, so a regression here
            # means that file stopped being compiled -- CMake builds only what
            # CMakeLists.txt lists, and a source file missing from the list
            # compiles cleanly and exports nothing.
            missing=$(comm -23 mcgl_union.txt "$RUNNER_TEMP/syms-$abi.txt" | grep -c '^gl[A-Z]' || true)
            if [ "$missing" -ne 0 ]; then
              echo "::error::$abi is missing $missing name(s) Minecraft resolves:"
              comm -23 mcgl_union.txt "$RUNNER_TEMP/syms-$abi.txt" | grep '^gl[A-Z]' | sed 's/^/    /'
              fail=1
            else
              echo "  all $(grep -c . mcgl_union.txt) Minecraft-resolved names exported"
            fi
          done
          if [ "$found" -ne 3 ]; then
            echo "::error::only $found of 3 ABIs were built"
            fail=1
          fi
          exit $fail

      - name: Build the plugin APK
        working-directory: plugin
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: exported-symbols
          path: exported-*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: plugin/build/outputs/apk/release/*.apk

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            plugin/build/outputs/apk/release/*.apk \
            --generate-notes