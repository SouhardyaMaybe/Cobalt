name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is checked in, so the build asks for Gradle directly.
      # The version is pinned for the same reason the NDK is: an unpinned build
      # toolchain turns a green build red with no code change, which is
      # indistinguishable from a real regression.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The NDK is required locally too. See build-android.sh.
      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build the renderer
        run: |
          set -euo pipefail
          chmod +x build-android.sh
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          if [ -z "$NDK" ]; then echo "::error::NDK path is empty"; exit 1; fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "::group::$abi"
            ANDROID_NDK_HOME="$NDK" \
            COBALT_ABI="$abi" \
              ./build-android.sh
            echo "::endgroup::"
          done

      # A renderer that silently loses entry points still builds. The counts are
      # the guard, and this job fails rather than warns.
      # Cross-ABI, and the last thing that can catch a renderer that quietly
      # stopped translating. build-android.sh checks only the ABI it just built,
      # because CI invokes it once per ABI; completeness is a whole-build
      # property, so it is asserted here, once.
      - name: Audit the exported ABI
        env:
          # comm(1) is collation-sensitive. Both sides of the comparison below
          # are sorted by sort(1), so they must agree on locale too; LC_ALL=C
          # makes that independent of whatever the runner defaults to.
          LC_ALL: C
        run: |
          set -euo pipefail
          # comm(1) reports a set difference only if both inputs are sorted
          # with the SAME collation. The exported list is sorted by sort(1) and
          # this one was sorted by Python -- codepoint order, which differs from
          # sort's locale collation under en_US.UTF-8:
          #
          #   sort u.txt | md5sum   LC_ALL=C           d687149e...
          #   sort u.txt | md5sum   LC_ALL=en_US.UTF-8 cc729418...
          #   python sorted u.txt   md5sum             d687149e...
          #
          # With the two disagreeing, comm reported 29 names missing while every
          # one of them was exported -- the sort-order mismatch showed up as a
          # symbol failure. Generated by sort, like the other side.
          python3 -c "import json;[print(n) for n in json.load(open('research-mcgl/union_symbols.json'))]" \
            | sort > mcgl_union.txt
          fail=0
          found=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="plugin/src/main/jniLibs/$abi/libcobalt.so"
            if [ ! -f "$so" ]; then
              echo "::error::$abi was never built; the APK would ship without it"
              fail=1
              continue
            fi
            found=$((found + 1))
            # After stripping. nm -D reads the dynamic symbol table, which
            # --strip-unneeded leaves alone, so this also proves the strip did not
            # take the exports with it.
            gl=$(nm -D --defined-only "$so" | grep -cE ' T gl[A-Z]' || true)
            egl=$(nm -D --defined-only "$so" | grep -cE ' T egl' || true)
            echo "== $abi: gl*=$gl egl*=$egl $(du -h "$so" | cut -f1) =="
            # Size floor. The three stripped builds in ref/towo-builds/ are 5.9 MB
            # each; an unstripped build of the same renderer is 54 MB. This is a
            # backstop against the strip step silently not running, not a target.
            mb=$(( $(stat -c%s "$so") / 1048576 ))
            if [ "$mb" -gt 12 ]; then
              echo "::error::$abi is ${mb}MB; expected ~6MB stripped. The strip step did not run."
              fail=1
            fi
            # The renderer exports far more than this. These are floors, not
            # targets: they catch a build that stopped translating rather than
            # one that lost a handful of entry points.
            if [ "$gl" -lt 2000 ]; then
              echo "::error::$abi exported only $gl gl* symbols"
              fail=1
            fi
            if [ "$egl" -lt 20 ]; then
              echo "::error::$abi exported only $egl egl* symbols"
              fail=1
            fi
            # The exported symbol list, kept so it can be diffed against
            # research-mcgl/union_symbols.json -- the union of every GL symbol
            # Minecraft 1.13.2 through 26.3 resolves. Comparing the two
            # locally is far better than adding one probe at a time here.
            nm -D --defined-only "$so" | awk '$2=="T"{print $3}' | sort > "$RUNNER_TEMP/syms-$abi.txt"
            echo "  exported: $(wc -l < "$RUNNER_TEMP/syms-$abi.txt")"
            cp "$RUNNER_TEMP/syms-$abi.txt" "exported-$abi.txt"
            # 26.3 compares the address of glGetError across lookup paths
            # (dlsym vs eglGetProcAddress vs SDL_GL_GetProcAddress), so it has
            # to resolve to exactly one pointer.
            n=$(nm -D --defined-only "$so" | grep -c ' T glGetError$' || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::$abi exports glGetError $n times; 26.3 needs one address"
              fail=1
            fi
            # Undefined symbols are the one class of defect that a symbol-presence
            # check cannot see: a .so can export all 4937 names correctly and
            # still fail to dlopen because something it *needs* is missing.
            #
            # That is exactly what c++_shared produced. libc++_shared.so is in
            # neither the APK nor LD_LIBRARY_PATH -- a plugin's lib directory is
            # never added to it -- so the library failed on its first C++ symbol:
            #
            #   cannot locate symbol "_ZTVNSt6__ndk119basic_ostringstreamIcE..."
            #
            # on device, after an entirely green build. Only libc++/STL symbols
            # are checked: everything else undefined is legitimately resolved
            # from libandroid/libm/libc/libdl, which are in the NEEDED list.
            undef=$(nm -D --undefined-only "$so" | awk '{print $2}' \
                | grep -cE '^_Z.*(ndk1|St[0-9])' || true)
            if [ "$undef" -ne 0 ]; then
              echo "::error::$abi has $undef undefined C++ runtime symbol(s); the library will fail to dlopen"
              echo "::error::    is libc++_shared.so in NEEDED? $(readelf -dW "$so" | grep -c libc++_shared)"
              fail=1
            fi
            if readelf -dW "$so" | grep -q libc++_shared; then
              echo "::error::$abi links libc++_shared, which no plugin can resolve"
              fail=1
            fi

            # A renamed renderer must not still answer to the old name in the
            # strings a game reads.
            if nm -D --defined-only "$so" | grep -qi 'mobileglues'; then
              echo "::error::$abi still exports a MobileGlues symbol"
              fail=1
            fi
            # The full set of names Minecraft resolves, as a hard gate. Not a
            # count: a count cannot tell a rename from a removal, which is
            # exactly the mistake that produced the 28 missing ARB/EXT entries
            # in the first place.
            #
            # src/arb_ext.cpp exists to close this gap, so a regression here
            # means that file stopped being compiled -- CMake builds only what
            # CMakeLists.txt lists, and a source file missing from the list
            # compiles cleanly and exports nothing.
            # Direct probes, before the set comparison. comm output says which
            # names are absent but not whether they are absent from the binary or
            # absent from the comparison, and those two were impossible to tell
            # apart from the log alone.
            for probe in glActiveTextureARB glGenBuffersARB glGenFramebuffersEXT glGetProgrami; do
                if grep -qx "$probe" "$RUNNER_TEMP/syms-$abi.txt"; then
                    echo "    probe $probe: present"
                else
                    echo "    probe $probe: ABSENT"
                fi
            done
            missing=$(comm -23 mcgl_union.txt "$RUNNER_TEMP/syms-$abi.txt" | grep -c '^gl[A-Z]' || true)
            if [ "$missing" -ne 0 ]; then
              echo "::error::$abi is missing $missing name(s) Minecraft resolves:"
              comm -23 mcgl_union.txt "$RUNNER_TEMP/syms-$abi.txt" | grep '^gl[A-Z]' | sed 's/^/    /'
              fail=1
            else
              echo "  all $(grep -c . mcgl_union.txt) Minecraft-resolved names exported"
            fi
          done
          if [ "$found" -ne 3 ]; then
            echo "::error::only $found of 3 ABIs were built"
            fail=1
          fi
          exit $fail

      # Before the APK, not after: an unsigned APK cannot be installed, and the
      # launcher finds renderer plugins by querying installed packages, so an
      # unsigned build is not testable at all.
      # The launcher env the game will see, reconstructed from our config. The
      # first device run showed a doubled SDL_EGL_LIBRARY that no other check
      # would have seen, so this is asserted rather than left to a human read.
      # src/ replaces entry points that upstream declared via NATIVE_FUNCTION_HEAD,
      # so two things have to hold and neither is obvious:
      #
      #   1. Upstream's declaration is gone, or it is a duplicate symbol at link.
      #   2. Our replacement emits the ##ARB alias the macro used to emit.
      #
      # (2) is the one that actually happened. The replacement compiled, linked
      # and passed every check; glCompileShaderARB was simply gone, and only the
      # 256-name audit caught it. Both are now asserted before the build starts
      # rather than ten minutes in.
      - name: Check that replaced entry points keep their aliases
        run: |
          set -euo pipefail
          fail=0
          for sym in glCompileShader; do
            if grep -rq "NATIVE_FUNCTION_HEAD(void, $sym," ref/mobileglues/MobileGlues-cpp/gl/; then
              echo "::error::upstream still declares $sym; src/ defines it too (duplicate symbol)"
              fail=1
            fi
            # GLAPI is required on the alias itself. An __attribute__((alias)) does
            # not inherit its target's visibility, so an alias written without it
            # compiles, links and exports nothing under -fvisibility=hidden.
            # Verified both ways:
            #     no GLAPI  -> nm -D shows target_a only
            #     with GLAPI-> nm -D shows alias_a and target_a, same address
            if ! grep -rq "GLAPI.*GLAPIENTRY void ${sym}ARB.*alias(\"$sym\")" src/; then
              echo "::error::src/ does not export ${sym}ARB with default visibility"
              fail=1
            fi
          done
          exit $fail

      - name: Check the launcher environment
        run: python3 tools/check-env.py

      # Runs after the renderer build because build-android.sh applies patches/.
      # Without this, a shader-translation bug is only visible as a driver syntax
      # error in a logcat on a phone: the translation passes are pure std::string
      # work, so they compile clean, they link, and every ABI audit passes.
      #
      # This is where Minecraft 26.3 was lost. process_uniform_declarations matched
      # the bare substring "uniform", so it fired inside the `_uniform_instance_00_00`
      # identifiers that 26.3's SPIRV-Cross output is built from, ate the enclosing
      # condition and every statement up to the next `;`, and rewrote them as a
      # uniform declaration -- so every core/terrain shader reached the driver as
      # `if (_uniform _instance_00_00 ;`.
      - name: Test the GLSL translation passes
        run: ./tools/test-glsl.sh

      # Parses plugin/config/cobalt-settings.json with the same cJSON the renderer
      # uses. A missing key is not an error there -- config_get_int() answers -1 and
      # init_settings() reads -1 as "absent" -- so the file has to be checked by
      # something that reports instead of defaulting.
      - name: Test the renderer settings
        run: ./tools/test-config.sh

      # Every #include in src/*.cpp and patches/ must resolve to a file we
      # ship. The failure mode otherwise is a bare "fatal error: 'x.h' file not
      # found" naming a header nobody in this repository has heard of.
      - name: Check that shipped sources are self-contained
        run: |
          set -euo pipefail
          fail=0
          for f in src/*.cpp; do
            for inc in $(grep -oE '#include "[^"]+"' "$f" | sed 's/#include "//;s/"//'); do
              case "$inc" in
                ../*) continue ;;   # upstream's own headers, resolved in-tree
              esac
              if [ ! -f "ref/mobileglues/MobileGlues-cpp/gl/$inc" ] && [ ! -f "src/$inc" ]; then
                echo "::error::$f includes \"$inc\", which is neither in src/ nor upstream"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Generate the signing key
        run: ./tools/gen-key.sh

      - name: Build the plugin APK
        working-directory: plugin
        run: gradle assembleRelease --no-daemon --stacktrace

      # if: always(). The symbol list is the evidence for whatever the audit
      # says, and an audit that fails without publishing it cannot be diagnosed
      # without re-running the build.
      # The APK is the deliverable, and two things about it fail silently: an
      # unsigned APK installs nowhere, and a missing ABI shows up as a plugin
      # the launcher lists but cannot load. Both are checked here rather than on
      # a device.
      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=$(ls plugin/build/outputs/apk/release/*.apk)
          echo "artifact: $apk ($(du -h "$apk" | cut -f1))"

          python3 - "$apk" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          signed = any(n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC"))
                       for n in names)
          print("signed:", signed)
          if not signed:
              sys.exit("APK is unsigned; Android will refuse to install it")
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
              so = "lib/%s/libcobalt.so" % abi
              present = so in names
              print("%s: %s" % (abi, "%d bytes" % z.getinfo(so).file_size if present else "MISSING"))
              if not present:
                  sys.exit("%s is missing; the launcher would list a plugin it cannot load" % abi)
          # The launcher reads the renderer config from this string resource, so
          # its absence means a silently skipped plugin.
          arsc = z.read("resources.arsc")
          for probe in (b"opengles3", b"libcobalt.so", b"SDL_OPENGL_LIBRARY"):
              if probe not in arsc:
                  sys.exit("resources.arsc is missing %r; the launcher would not find the config" % probe)
          print("renderer config resource: present")

          # The renderer's own config.json, read at startup from
          # nativeLibraryDir/cobalt. Missing it is not an install error: the renderer
          # falls back to defaults and logs "Failed to load config", which cost
          # maxGlslCacheSize = 0 and with it the negative shader cache. Nothing else
          # noticed, because every other artefact is still correct.
          shipped = open("plugin/config/cobalt-settings.json", "rb").read()
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
              entry = "lib/%s/cobalt/config.json" % abi
              if entry not in names:
                  sys.exit("%s is missing; the renderer will fall back to defaults" % entry)
              if z.read(entry) != shipped:
                  sys.exit("%s differs from plugin/config/cobalt-settings.json" % entry)
          print("renderer settings: staged for all three ABIs")
          PY

      # The version the APK reports is a build input that stayed hardcoded at 0.1.0
      # for six releases, so v0.3.2's own App info screen said 0.1.0 and no check
      # noticed: the build faithfully produced the artifact it was asked for. Read
      # back out of the built APK rather than out of VERSION, because the thing that
      # was wrong is the artifact.
          python3 - "$(apk)" VERSION <<'PY'
          import re, sys, zipfile
          # The binary manifest stores versionCode and versionName as a string pool;
          # aapt is the reliable reader and is on the runner.
          apk, version_file = sys.argv[1], sys.argv[2]
          expected = open(version_file).read().strip().removeprefix("v")
          out = subprocess.run(
              ["$ANDROID_HOME/build-tools/34.0.0/aapt", "dump", "badging", apk],
              capture_output=True, text=True, check=True).stdout
          name = re.search(r"^versionName='([^']*)'", out, re.M)
          code = re.search(r"^versionCode='([^']*)'", out, re.M)
          if not name or not code:
              sys.exit("aapt reported no version; the check cannot run")
          print("APK reports: %s (%s)" % (name.group(1), code.group(1)))
          if name.group(1) != expected:
              sys.exit("APK says versionName=%s but VERSION says %s"
                       % (name.group(1), expected))
          major, minor, patch = expected.split("-")[0].split("+")[0].split(".")
          want_code = int(major) * 10000 + int(minor) * 100 + int(patch)
          if int(code.group(1)) != want_code:
              sys.exit("APK says versionCode=%s but %s maps to %d"
                       % (code.group(1), expected, want_code))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-symbols
          path: exported-*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: plugin/build/outputs/apk/release/*.apk

      # No publish step here. GITHUB_TOKEN is scoped to the repository's own
      # contents and cannot create a release:
      #
      #   HTTP 403: Resource not accessible by integration
      #   .../repos/SouhardyaMaybe/Cobalt/releases
      #
      # which failed the last step of an otherwise green build and read like a
      # permissions problem with the build rather than with the publishing. The
      # artifacts are uploaded either way; releases are cut from a machine with
      # a token that has repo scope, via tools/publish.sh.
