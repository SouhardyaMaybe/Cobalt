# AGP needs headroom: three ABIs of a large native library in one pass.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m

org.gradle.parallel=true

# Caching is off deliberately. The renderer .so is staged into jniLibs by
# build-android.sh before Gradle runs, and Gradle's inputs do not include it --
# so a cached APK could ship a stale renderer from an earlier run. The renderer
# build is fast enough that the cache buys nothing and can hide a real change.
org.gradle.caching=false